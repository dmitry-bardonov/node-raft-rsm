<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Raft command replication trace</title><desc id="d">Leader proposal, follower acknowledgements, quorum commit and state machine application.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#122944"/><stop offset="1" stop-color="#07111f"/></linearGradient><linearGradient id="c" x2="1" y2="1"><stop stop-color="#17304a"/><stop offset="1" stop-color="#0a1626"/></linearGradient></defs><rect width="1200" height="520" rx="16" fill="url(#b)"/><text x="42" y="52" fill="#4fd2c0" font-family="monospace" font-size="11" letter-spacing="3">COMMAND REPLICATION</text><text x="42" y="91" fill="#f4f8ff" font-family="sans-serif" font-size="25" font-weight="700">PUT counter = 2</text><text x="42" y="119" fill="#8fa3bb" font-family="sans-serif" font-size="14">Proposal → quorum commit → state-machine apply</text><g transform="translate(55 180)"><rect width="230" height="165" rx="12" fill="url(#c)" stroke="#5eead4" stroke-width="2"/><text x="20" y="34" fill="#5eead4" font-family="monospace" font-size="11" font-weight="700">LEADER · node-1</text><text x="20" y="75" fill="#668099" font-family="monospace" font-size="11">LOG INDEX</text><text x="20" y="107" fill="#f1f6ff" font-family="monospace" font-size="28">3</text><text x="108" y="75" fill="#668099" font-family="monospace" font-size="11">TERM</text><text x="108" y="107" fill="#f1f6ff" font-family="monospace" font-size="28">2</text><rect x="20" y="126" width="190" height="27" rx="5" fill="#0c1929"/><text x="34" y="145" fill="#5eead4" font-family="monospace" font-size="11">counter = 2</text></g><g stroke="#5eead4" stroke-width="2" fill="none"><path d="M300 250 H420"/><path d="M405 235 l15 15 -15 15"/><path d="M300 290 H420"/><path d="M405 275 l15 15 -15 15"/></g><text x="323" y="224" fill="#8fa3bb" font-family="sans-serif" font-size="12">Append Entries</text><text x="329" y="330" fill="#8fa3bb" font-family="sans-serif" font-size="12">quorum ack</text><g transform="translate(445 150)"><rect width="225" height="110" rx="12" fill="url(#c)" stroke="#354e6b"/><text x="20" y="34" fill="#7890a9" font-family="monospace" font-size="11" font-weight="700">FOLLOWER · node-2</text><text x="20" y="72" fill="#668099" font-family="monospace" font-size="11">MATCH INDEX</text><text x="20" y="99" fill="#f1f6ff" font-family="monospace" font-size="26">3</text></g><g transform="translate(445 310)"><rect width="225" height="110" rx="12" fill="url(#c)" stroke="#354e6b"/><text x="20" y="34" fill="#7890a9" font-family="monospace" font-size="11" font-weight="700">FOLLOWER · node-3</text><text x="20" y="72" fill="#668099" font-family="monospace" font-size="11">MATCH INDEX</text><text x="20" y="99" fill="#f1f6ff" font-family="monospace" font-size="26">3</text></g><path d="M715 280 H790" stroke="#5eead4" stroke-width="2"/><path d="M775 265 l15 15 -15 15" fill="none" stroke="#5eead4" stroke-width="2"/><g transform="translate(815 175)"><rect width="330" height="190" rx="12" fill="#0d1c2e" stroke="#223650"/><text x="22" y="35" fill="#4fd2c0" font-family="monospace" font-size="11" letter-spacing="2">TIMELINE</text><text x="22" y="78" fill="#59e2c4" font-family="sans-serif" font-size="14" font-weight="700">Command</text><text x="22" y="102" fill="#cfe0f0" font-family="sans-serif" font-size="14">PUT counter = 2 proposed</text><text x="22" y="145" fill="#59e2c4" font-family="sans-serif" font-size="14" font-weight="700">Command</text><text x="22" y="169" fill="#cfe0f0" font-family="sans-serif" font-size="14">committed and applied · index 3</text></g><text x="55" y="470" fill="#8fa3bb" font-family="sans-serif" font-size="14">The visualizer makes append, commit, and apply visible as separate stages.</text></svg>
